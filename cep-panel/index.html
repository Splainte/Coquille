<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: "Adobe Clean", "Segoe UI", sans-serif; margin: 0; padding: 12px; color: #e8e8e8; background: #1d1d1d; }
      h1 { font-size: 14px; margin: 0 0 12px; }
      .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
      select, button { font-size: 12px; padding: 6px 8px; background: #333; color: #eee; border: 1px solid #555; border-radius: 3px; }
      button { cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      #statusRow { display: flex; align-items: center; gap: 8px; margin: 8px 0; min-height: 16px; }
      #status { font-size: 11px; color: #9aa; white-space: pre-wrap; }
      #cues { font-size: 11px; max-height: 300px; overflow: auto; border-top: 1px solid #444; padding-top: 8px; }
      .cue { padding: 6px 0; border-bottom: 1px solid #333; }
      .cue .tc { color: #7ab; }
      .cue textarea { width: 100%; box-sizing: border-box; background: #2a2a2a; color: #eee; border: 1px solid #444; font-size: 13px; }

      /* Section repliable des corrections */
      details.corr { font-size: 11px; margin: 4px 0 10px; border-top: 1px solid #444; padding-top: 6px; }
      details.corr summary { cursor: pointer; color: #cdd; user-select: none; }
      details.corr .item { display: flex; align-items: baseline; gap: 6px; padding: 3px 0; }
      .corr .orig { color: #c88; text-decoration: line-through; }
      .corr .arrow { color: #777; }
      .corr .new { color: #8c8; }
      .corr .src { color: #777; font-size: 10px; }
      .corr .loc { color: #7ab; cursor: pointer; text-decoration: underline; margin-left: auto; white-space: nowrap; }
      .corr .loc:hover { color: #9cf; }
      .corr .sugg { display: flex; align-items: baseline; gap: 6px; cursor: pointer; }
      .corr .sugg input { margin: 0 2px 0 0; }
      .corr .bulk { gap: 6px; }
      .corr .bulk button { font-size: 10px; padding: 2px 8px; }

      /* Spinner d'attente (transcription). La passe LLM aura plus tard sa propre
         animation aux codes « IA ». */
      .spinner { width: 14px; height: 14px; flex: 0 0 auto; border: 2px solid #444;
        border-top-color: #7ab; border-radius: 50%; animation: spin 0.8s linear infinite; }
      .spinner.hidden { display: none; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Indicateur + réglage de la clé OpenRouter */
      #llmRow { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #bbb;
        margin: -4px 0 10px; }
      #llmDot { width: 9px; height: 9px; border-radius: 50%; background: #666; flex: 0 0 auto; }
      #llmDot.ok { background: #5c5; } #llmDot.warn { background: #db4; }
      #llmDot.bad { background: #d55; } #llmDot.none { background: #777; }
      #llmText { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #llmRow button { font-size: 10px; padding: 2px 8px; }
      #keyBox { font-size: 11px; background: #262626; border: 1px solid #444; border-radius: 3px;
        padding: 8px; margin-bottom: 10px; }
      #keyBox.hidden { display: none; }
      #keyBox p { margin: 0 0 6px; color: #aaa; line-height: 1.35; }
      #keyBox a { color: #7ab; cursor: pointer; text-decoration: underline; }
      #keyInput { width: 100%; box-sizing: border-box; font-size: 12px; padding: 5px 6px;
        background: #1d1d1d; color: #eee; border: 1px solid #555; border-radius: 3px; margin-bottom: 6px; }
      #keyBox .row { margin-bottom: 4px; flex-wrap: wrap; }
      #keyBox button { font-size: 11px; padding: 3px 8px; }
      #keyMsg { min-height: 14px; color: #9aa; white-space: pre-wrap; }

      /* Zone à sous-titrer + barre d'avancement de la transcription */
      #zone { font-size: 11px; color: #9ab; margin: -4px 0 10px; }
      #progress { height: 6px; background: #333; border-radius: 3px; overflow: hidden; margin: 0 0 8px; }
      #progress.hidden { display: none; }
      #progressFill { height: 100%; width: 0; background: #7ab; transition: width 0.4s ease; }
      #progress.indeterminate #progressFill { width: 30%; animation: slide 1.2s ease-in-out infinite; }
      @keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
    </style>
  </head>
  <body>
    <h1>Coquille</h1>

    <div id="llmRow" title="Correction IA (OpenRouter)">
      <span id="llmDot"></span>
      <span id="llmText">Clé OpenRouter : …</span>
      <button id="llmSettings">Clé…</button>
    </div>
    <div id="keyBox" class="hidden">
      <p>Clé OpenRouter pour les suggestions de correction IA. Elle est enregistrée
        sur la machine du backend (backend/.env) et n'est jamais réaffichée.
        <a id="keyLink">Créer une clé sur openrouter.ai</a></p>
      <input type="password" id="keyInput" placeholder="sk-or-v1-…" autocomplete="off" spellcheck="false" />
      <div class="row">
        <button id="keySave">Enregistrer</button>
        <button id="keyTest">Tester</button>
        <button id="keyDelete">Retirer</button>
        <button id="keyClose">Fermer</button>
      </div>
      <div id="keyMsg"></div>
    </div>

    <div class="row">
      <label for="media">Média :</label>
      <select id="media"></select>
    </div>

    <div class="row">
      <label for="engine">Moteur :</label>
      <select id="engine"></select>
    </div>

    <div class="row">
      <label for="maxchars">Max car./ligne :</label>
      <input type="number" id="maxchars" min="10" max="80" step="1" value="24"
             style="width: 56px;" />
    </div>

    <div class="row">
      <button id="generate">1. Générer les sous-titres</button>
    </div>
    <div id="zone" title="Points d'entrée/sortie de la séquence, sinon clips sélectionnés, sinon toute la séquence">Zone : …</div>
    <div class="row">
      <label><input type="checkbox" id="offline" /> Mode hors-ligne (glossaire seul, sans LLM)</label>
    </div>

    <div id="statusRow">
      <div id="spinner" class="spinner hidden"></div>
      <div id="status"></div>
    </div>
    <div id="progress" class="hidden"><div id="progressFill"></div></div>
    <div id="corrections"></div>
    <div id="cues"></div>

    <div class="row">
      <button id="insert" disabled>2. Insérer dans la séquence</button>
    </div>

    <!-- Config machine, non versionnée (cf. js/config.local.example.js) -->
    <script src="js/config.local.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
